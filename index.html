<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta
      name="description"
      content="Explora la feria con Fexpo. Mapa, stands, visitas y experiencias en un solo lugar."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Inter-Regular.otf" as="font" type="font/otf" crossorigin />
    <title>Fexpo · Tu feria, a tu ritmo</title>
    <script>
      try {
        const mode = localStorage.getItem('fexpo-pwa-theme') || 'system';
        const dark =
          mode === 'dark' ||
          (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101012' : '#f6f8fc';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
